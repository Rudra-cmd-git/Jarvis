[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop AI assistant"
authors = ["JARVIS"]
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
keyring = { version = "3.6.3", features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "multipart", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1.20.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
